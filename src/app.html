<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- SVG for modern browsers -->
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/favicon.svg">
	<!-- PNG/ICO fallback for older browsers -->
	<link rel="icon" type="image/png" href="%sveltekit.assets%/icons/favicon.png">
	<!-- Legacy IE fallback -->
	<link rel="shortcut icon" href="%sveltekit.assets%/icons/favicon.ico">

	<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
	%sveltekit.head%
</head>

<body class="relative bg-sidebar font-sans text-foreground antialiased"
	data-sveltekit-preload-data="hover">
	<div class="isolate relative flex min-h-svh flex-col">
		%sveltekit.body%
	</div>
</body>

</html>
